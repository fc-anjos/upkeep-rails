name: Upkeep native packages

on:
  pull_request:
    paths:
      - ".github/workflows/sqlglot-semantics.yml"
      - "ext/upkeep_sqlglot_semantics/**"
      - "lib/upkeep/sqlglot_semantics.rb"
      - "lib/upkeep/sqlglot_semantics/**"
      - "Rakefile"
      - "upkeep-rails.gemspec"
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  platform-gem:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: x86_64-linux-gnu
          - runner: ubuntu-24.04-arm
            platform: aarch64-linux-gnu
          - runner: macos-15-intel
            platform: x86_64-darwin
          - runner: macos-15
            platform: arm64-darwin

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install Ruby dependencies
        run: ruby -S gem install sqlglot:0.1.1 minitest rake bundler --no-document

      - name: Test and package
        run: |
          ruby -S rake native:build
          ruby -Ilib test/sqlglot_semantics_api_test.rb
          ruby -S rake native:package PLATFORM=${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: upkeep-rails-${{ matrix.platform }}
          path: pkg/upkeep-rails-*.gem
          if-no-files-found: error
